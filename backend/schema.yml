components:
  schemas:
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          title: 이메일 주소
          maxLength: 254
        profile:
          allOf:
          - $ref: '#/components/schemas/UserProfile'
          readOnly: true
      required:
      - id
      - profile
    UserProfile:
      type: object
      properties:
        nickname:
          type: string
          maxLength: 12
        user_type:
          $ref: '#/components/schemas/UserTypeEnum'
        survey_completed:
          type: boolean
      required:
      - nickname
    UserTypeEnum:
      enum:
      - new
      - active
      - returning
      type: string
      description: |-
        * `new` - 신규 사용자
        * `active` - 기존 사용자
        * `returning` - 복귀 사용자
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
